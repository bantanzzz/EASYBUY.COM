<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes subtle-zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        .animate-subtle-zoom {
            animation: subtle-zoom 20s infinite alternate ease-in-out;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>

<body class="bg-background text-on-surface font-body-md overflow-hidden h-screen w-screen flex flex-col justify-center items-center" data-page="landing">
<!-- Hero Background Layer -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full object-cover animate-subtle-zoom" data-alt="A professional aerial view of a bustling modern city center in Sierra Leone with clean architecture and vibrant marketplace activity. The scene is shot during golden hour, bathing the cityscape in a warm, trustworthy glow. The visual style is crisp and high-resolution, evoking a sense of growth, digital transformation, and professional commerce. Soft focus on the background ensures UI elements remain legible." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDkq5BgvJkob8qNiAvpAUfRRWHHh1jrH2st2nQNvLhMQ_NhJd--J8kTDVmUio6YBEX4ny3u9qlhcf259EyF7uMISauwQmr_FKymdb46Y5owlzTEqZkb88917rselGJTRFOWQeYtFYDu1rGbkr80tud4OOzoOuJUuQgF5-RpSm74DpHo8WLezkSptOGKPCGt8AFRU42t4lioo-wteJUicH5BHXx-u8uuLuZv_wOOTKPGuMjPeoESTo45Rg8DG-b7c-dMdW5SwupbWxIc')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-primary/10 via-surface/60 to-surface"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-lg px-margin-mobile text-center flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-12 group transition-transform duration-500 hover:scale-105">
<div class="flex items-center justify-center space-x-3 mb-4">
<div class="w-16 h-16 bg-primary-container flex items-center justify-center rounded-2xl shadow-lg border border-primary/20">
<span class="material-symbols-outlined text-on-primary-container text-[40px]" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
</div>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">
                Easy Buy
            </h1>
<div class="h-1 w-12 bg-secondary mx-auto mt-2 rounded-full"></div>
</div>
<!-- Tagline & Branding -->
<div class="space-y-4 mb-16">
<h2 class="font-headline-md text-headline-md text-on-surface-variant max-w-[280px] mx-auto">
                Modern Commerce for Sierra Leone
            </h2>
<p class="font-body-md text-body-md text-outline italic">
                Your Trusted Managed Marketplace
            </p>
</div>
<!-- Action Area -->
<div class="w-full space-y-6">
<!-- Get Started Button -->
<button class="w-full h-[56px] bg-primary text-on-primary font-label-md text-label-md rounded-xl shadow-md hover:bg-primary-container hover:shadow-xl transition-all duration-300 active:scale-95 flex items-center justify-center space-x-2 relative overflow-hidden group" id="get-started" type="button">
<span class="absolute inset-0 shimmer opacity-0 group-hover:opacity-100 transition-opacity"></span>
<span>Get Started</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Loading Indicator (Initially Hidden) -->
<div class="hidden flex flex-col items-center space-y-4" id="loading-spinner">
<div class="w-12 h-12 border-4 border-surface-container-highest border-t-primary rounded-full animate-spin"></div>
<p class="font-label-sm text-label-sm text-outline animate-pulse">Initializing marketplace...</p>
</div>
<!-- Alternative Action -->
<div class="flex justify-center items-center space-x-6 pt-4 border-t border-outline-variant">
<a class="font-label-sm text-label-sm text-primary hover:underline flex items-center space-x-1" href="vendor-auth.html">
<span class="material-symbols-outlined text-[16px]">store</span>
<span>Become a Vendor</span>
</a>
<span class="h-4 w-[1px] bg-outline-variant"></span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="home.html">
                    Help Center
                </a>
</div>
</div>
</main>
<!-- Bottom Branding Footnote -->
<footer class="fixed bottom-8 z-10 w-full text-center px-margin-mobile">
<p class="font-label-sm text-label-sm text-outline uppercase tracking-widest opacity-60">
            © 2026 Easy Buy Sierra Leone
        </p>
</footer>
<!-- Decorative Elements -->
<div class="fixed top-[-100px] right-[-100px] w-64 h-64 bg-secondary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-[-100px] left-[-100px] w-80 h-80 bg-primary/10 blur-[120px] rounded-full pointer-events-none"></div>
<script>
        document.getElementById('get-started').addEventListener('click', function() {
            const btn = this;
            const spinner = document.getElementById('loading-spinner');
            
            // Interaction: Fade out button and show loading state
            btn.style.opacity = '0';
            btn.style.pointerEvents = 'none';
            
            setTimeout(() => {
                btn.classList.add('hidden');
                spinner.classList.remove('hidden');
                spinner.classList.add('flex');
                
                // Simulate transition to main app after 1.5s
                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.8s ease';
                    window.location.href = 'home.html';
                }, 1500);
            }, 300);
        });

        // Ambient entry animation
        window.addEventListener('load', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transform = 'translateY(20px)';
            
            requestAnimationFrame(() => {
                main.style.transition = 'opacity 1s ease, transform 1s ease';
                main.style.opacity = '1';
                main.style.transform = 'translateY(0)';
            });
        });
    </script>
